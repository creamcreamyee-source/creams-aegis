const  AUTHORED_DILEMMAS=[{"title":"녹슨 부두의 증인","pivot":"항구 수리공 리안은 배의 밑창에 갇힌 사람을 알고 있다. 그를 끌어올리면 밀수선장의 눈에 띌 것이고, 모른 척하면 배는 새벽에 떠난다.","choices":[{"label":"감시선을 속여 리안을 구조한다","stat":"DEX","axis":"mercy","success":"리안을 구조했다. 그는 붉은 돛의 항로를 직접 그린다.","failure":"경비가 접근해 리안의 오른손에 낙인을 찍는다. 지도는 얻었지만 리안은 당신을 경계한다."},{"label":"밀수 장부를 압수해 거래를 중단한다","stat":"INT","axis":"lore","success":"봉인된 화물의 수취인이 왕실 서기관임을 알아낸다.","failure":"장부는 불타지만 마지막 주문번호를 외운 소녀가 나타난다."}],"fallout":"구조한 사람의 이름을 지킬지, 진실을 공개할지 결정해야 한다."},{"title":"통행료를 받는 무명 병사","pivot":"상관에게서 도망친 병사가 다리 밑에 숨었다. 병사는 난민의 신분증을 지우라는 명령을 받았고, 명령을 거부하면 가족이 처형된다고 주장한다.","choices":[{"label":"병사의 가족을 구할 통로를 만든다","stat":"WIS","axis":"mercy","success":"병사는 증언을 대가로 협력한다. 검문소의 암호와 경비 교대 시간이 나온다.","failure":"밀고자가 도망가며 검문소에 비상이 걸린다. 가족의 소재만 확보했다."},{"label":"명령서의 원본에 적힌 이름을 확인한다","stat":"INT","axis":"lore","success":"명령서에 존재하지 않는 군대가 서명했다는 사실을 증명한다.","failure":"서명은 지워졌지만 붉은 양피지의 섬유를 회수한다."}],"fallout":"세린은 누구를 구할 수 있느냐보다 누구를 포기할 것인가를 묻는다."},{"title":"죽은 자에게 지급된 월급","pivot":"회계사 소미는 길드가 살아 있는 노동자들을 사망자로 처리했다고 고백한다. 하지만 조작된 장부를 공개하면 그들의 치료비 지급도 중단된다.","choices":[{"label":"피해자의 급여와 신분을 동시에 보전한다","stat":"CHA","axis":"mercy","success":"가족들이 함께 증언하면서 길드의 협상권을 빼앗는다.","failure":"가족 대표가 협박을 받고 자리를 떠난다. 진술서가 절반만 남았다."},{"label":"지급 일자와 장례 명단의 차이를 추적한다","stat":"INT","axis":"lore","success":"장부에 없는 이름 하나가 세 왕관 모두의 재무관과 연결된다.","failure":"암호는 풀지 못했지만 허위 영수증의 인장을 확보한다."}],"fallout":"마지막 장부를 불태우면 피해자들의 채무까지 사라진다. 대신 누가 범인인지 영영 증명할 수 없게 된다."},{"title":"협곡의 마지막 다리","pivot":"검은 깃발의 군벌이 다리 저편에 포로 일곱을 묶어 놓았다. 다리를 끊으면 적군의 진격은 막히지만 포로까지 절벽에 남는다.","choices":[{"label":"다리 위의 포로를 구조한다","stat":"DEX","axis":"mercy","success":"포로들은 구해졌지만 군벌이 당신의 얼굴을 기억한다.","failure":"구조 중 포로 하나가 붙잡힌다. 그가 남긴 목걸이가 군벌의 비밀을 가리킨다."},{"label":"다리의 지지대를 손상시켜 통행을 통제한다","stat":"INT","axis":"order","success":"누구도 강을 장악하지 못하게 만들었다. 군벌은 돌아갈 길을 찾는다.","failure":"다리 일부가 무너져 마을의 식량 수송도 늦어진다."}],"fallout":"협곡 아래의 촌락은 당신에게 어느 편의 다리인지 묻는다."},{"title":"지워진 영웅의 비석","pivot":"묘지 관리인 여사는 어젯밤까지 읽을 수 있던 남편의 이름이 사라졌다고 울먹인다. 비석 아래에는 남편이 반역자로 처형된 기록이 있다.","choices":[{"label":"마을 주민들의 기억을 모아 이름을 복원한다","stat":"WIS","axis":"mercy","success":"모두가 서로 다른 기억을 내놓았지만 하나의 진실이 남았다.","failure":"증언이 충돌해 누군가가 기억을 고친 흔적이 드러난다."},{"label":"석판을 해체해 역사 조작의 구조를 조사한다","stat":"INT","axis":"lore","success":"석판에는 같은 사건이 세 번 다시 쓰인 흔적이 있다.","failure":"석판 조각은 부서졌지만 지워지지 않는 한 글자를 얻는다."}],"fallout":"비석 주인은 생전에 왕을 죽이려 했다는 밀서를 남겼다. 이름을 복원하면 그 죄도 돌아온다."},{"title":"미래가 적힌 금서","pivot":"금서 수호자가 백호의 죽음 날짜를 담은 책을 펼친다. 책은 종이를 넘길 때마다 다른 미래를 보여준다. 사서 니온은 책을 읽는 사람부터 사라진다고 경고한다.","choices":[{"label":"위험을 감수해 책에 적힌 사람을 먼저 구한다","stat":"CON","axis":"mercy","success":"사라지려던 사서를 구하고 책 일부를 봉인한다.","failure":"구조에는 성공했지만 책이 백호의 이름 한 획을 빼앗았다."},{"label":"미래의 판본들을 대조해 거짓 예언을 찾아낸다","stat":"INT","axis":"lore","success":"세 판본 중 한 판본만 실제 사건과 일치하지 않는다. 누군가 미래를 위조했다.","failure":"문장들이 지워지는 대신 한 페이지의 날짜를 기억했다."}],"fallout":"수호자는 책을 가지고 나가면 도시의 한 구역이 삭제된다고 통보한다."},{"title":"세린의 두 번째 이름","pivot":"세린은 동생의 편지가 자기 필체라고 인정한다. 세린이 정말 찾는 사람은 동생인가, 잃어버린 자신의 이름인가. 경비가 세린을 수배한 이유가 드러난다.","choices":[{"label":"세린에게 편지를 돌려주고 선택권을 맡긴다","stat":"CHA","axis":"mercy","success":"세린은 동생을 찾겠다는 자신의 결심을 스스로 확정한다.","failure":"세린은 편지를 받았지만 당신이 책임을 떠넘겼다고 여긴다."},{"label":"편지의 암호를 풀어 발신인을 추적한다","stat":"INT","axis":"lore","success":"세린의 동생이 종의 조작을 막는 기록원이라는 단서를 얻는다.","failure":"암호는 한 줄만 풀렸지만 편지의 발신 시각이 미래로 표기돼 있다."}],"fallout":"세린은 당신의 조력자가 아니더라도 자신의 길을 걷겠다고 선언한다."},{"title":"백야의 요새 내부","pivot":"요새 지휘관은 성문을 연 병사를 반역자로 묶어 놓았다. 지하에서는 종의 파편을 노리는 무장병이 올라오고 있다. 병사를 풀면 침입자가 섞여 나갈 위험이 있다.","choices":[{"label":"전열을 나눠 인질과 수비대를 동시에 지킨다","stat":"STR","axis":"mercy","success":"수비대가 다시 방패를 들고 병사를 인도한다.","failure":"인질은 살렸지만 침입자들이 지하로 물러나 봉인을 건드린다."},{"label":"지하의 출입 기록에서 진짜 침입자를 골라낸다","stat":"INT","axis":"lore","success":"진짜 침입자는 요새 수비대 안에 있다는 사실이 드러났다.","failure":"오염된 출입 기록 대신 피로 적힌 암호를 확보한다."}],"fallout":"요새 문을 닫으면 시민이 갇히고, 열면 봉인의 파편이 탈취될 수 있다."},{"title":"그림자를 담보로 한 도시","pivot":"유리 도시의 아이들은 거리의 그림자가 왜 사라지는지 모른다. 채무 관리인은 그림자가 아니라 미래의 기억을 담보로 받는다고 설명한다.","choices":[{"label":"아이들의 채무를 풀기 위한 공개 계약을 제안한다","stat":"CHA","axis":"mercy","success":"채무 장부가 공개되자 시민들의 기억이 조금씩 돌아온다.","failure":"관리인은 당신의 공개 요구를 거절하지만 자신의 목소리가 흔들린다."},{"label":"동력 장치와 기억 채권의 연계를 끊는다","stat":"INT","axis":"lore","success":"계약서에 숨은 조항을 찾아 기억 환수를 시작한다.","failure":"장치를 손상시키며 도시의 불빛이 꺼질 위기에 처한다."}],"fallout":"모든 빚을 지우면 도시는 멈춘다. 한 가족만 구하면 나머지가 대가를 치른다."},{"title":"서약에 적힌 빈칸","pivot":"성소의 심판관은 도시를 구하려면 한 사람의 이름을 봉인해야 한다고 말한다. 구속된 사람은 고개를 끄덕이지만 말을 할 수 없다.","choices":[{"label":"말을 잃은 사람의 의사를 확인한다","stat":"WIS","axis":"mercy","success":"봉인이 당사자 동의 없이 체결됐다는 사실을 밝혀낸다.","failure":"심판관이 질문을 끊어 버렸지만 다른 계약서의 빈칸을 발견한다."},{"label":"약정의 숨은 조항을 읽어 통제권을 무효화한다","stat":"INT","axis":"lore","success":"서약의 한 줄이 모든 조약을 뒤집는 취소 조건임을 알게 된다.","failure":"서약의 취소에는 다른 이름의 서명이 필요하다는 조건만 발견했다."}],"fallout":"이름을 지키는 결정은 곧 다른 이름을 위험에 놓는다."},{"title":"움직이는 투표함","pivot":"철벽 도시의 밤에 투표함이 스스로 움직인다. 새벽에 공개된 표와 밤의 표는 같다. 그러나 후보들의 이름이 모두 바뀌어 있다.","choices":[{"label":"유권자의 실제 기억을 보존하는 증언을 수집한다","stat":"CHA","axis":"mercy","success":"도시 광장에 세대별 공개 증언이 쌓이기 시작한다.","failure":"증인 중 일부가 겁을 먹지만 아이들의 작은 기록이 남는다."},{"label":"투표함의 이동 궤적을 재구성한다","stat":"INT","axis":"lore","success":"후보들의 이름을 바꾼 기록 장치를 찾아낸다.","failure":"기계의 그림자는 붙잡지 못했지만 조작 시간이 기록됐다."}],"fallout":"공정한 투표를 지키는 방법과 당신이 지지하는 승자를 만드는 방법은 다르다."},{"title":"왕관 하나가 비어 있다","pivot":"세 왕이 휴전을 선언했지만 왕관을 쓴 병사가 왕의 말을 거부한다. 왕관이 말을 하는 것인지, 사람이 왕관의 기억을 흉내 내는 것인지 불분명하다.","choices":[{"label":"인질을 돌려보내고 전장의 증인을 안전하게 옮긴다","stat":"CHA","axis":"mercy","success":"인질 교환이 성립하며 각 왕은 작은 약속을 지킨다.","failure":"인질은 돌아왔지만 전선에는 배신을 걱정하는 병사가 남는다."},{"label":"세 왕관의 동일한 흠집을 조사한다","stat":"INT","axis":"lore","success":"세 왕관은 하나의 원본에서 나뉜 장치임이 밝혀진다.","failure":"왕관이 당신의 질문에 반응하며 한 조각의 소리를 낸다."}],"fallout":"전쟁을 멈추려면 왕관을 부숴야 하는가, 왕관을 쓴 사람들을 설득해야 하는가."},{"title":"기계에게도 장례가 있는가","pivot":"금속 나무 아래 수리공은 오래된 기계에게 장례를 치르고 있다. 기계는 폐기되기 직전 인간의 이름으로 도움을 요청한다.","choices":[{"label":"기계의 마지막 소원을 주민들이 듣게 한다","stat":"CHA","axis":"mercy","success":"사람과 기계가 처음으로 같은 자리에서 발언한다.","failure":"주민들은 침묵하지만 어린 견습공이 기록을 시작한다."},{"label":"오래된 구동 기록에서 자율적 판단의 증거를 찾는다","stat":"INT","axis":"lore","success":"기계가 과거 왕국의 거짓 기록을 거부했던 사실을 알아낸다.","failure":"기계의 기억 일부가 고장났지만 마지막 선택의 흔적을 확보한다."}],"fallout":"기계의 자유가 인간의 생존을 위협한다면 누가 결정권을 가져야 할까."},{"title":"신이 응답하지 않는 제단","pivot":"제단의 신관은 자신의 모든 신도가 이미 오래전에 죽었다는 사실을 안다. 지금 들리는 기도는 살아 있는 사람의 것이 아니라 기록된 음성이다.","choices":[{"label":"신관의 마지막 의식을 지켜보며 개입한다","stat":"WIS","axis":"mercy","success":"신관은 기도의 대상을 사람이 아닌 살아 있는 시민으로 바꾼다.","failure":"마지막 의식에 실패했지만 오래된 약속 하나가 해제된다."},{"label":"기도의 반복 주기를 분석해 신성의 근원을 추적한다","stat":"INT","axis":"lore","success":"신성은 신의 의지가 아니라 선택을 증폭하는 장치였음이 드러난다.","failure":"수식은 완성되지 않았지만 제단이 누구의 이름을 감추는지 알아낸다."}],"fallout":"신을 믿지 않는 사람에게도 신의 힘을 강요할 수 있는가."},{"title":"어제 도착한 내일의 편지","pivot":"국경의 골짜기에서는 오늘 도착한 편지를 어제 보냈다고 주장한다. 편지에는 아직 발생하지 않은 학살의 날짜가 적혀 있다.","choices":[{"label":"편지의 경고를 주민들에게 신중히 공개한다","stat":"CHA","axis":"mercy","success":"주민들이 피난로를 만들며 미래의 기록이 변하기 시작한다.","failure":"사람들이 믿지 않지만 크림이가 안전한 길 하나를 찾는다."},{"label":"편지의 날짜를 역산해 균열을 안정화한다","stat":"INT","axis":"lore","success":"균열이 시간을 되감는 조건을 파악한다.","failure":"계산은 불완전하지만 한 지점의 시간이 고정됐다."}],"fallout":"미래의 참사를 막는 행동이 다른 참사를 만드는 역설이 나타난다."},{"title":"은방울을 알아본 나무","pivot":"잠든 숲의 가장 오래된 나무가 크림이의 은방울에 맞춰 숨을 쉰다. 나무 속에서 백호가 하지 않은 선택이 메아리친다.","choices":[{"label":"크림이의 판단을 우선해 안전한 기억부터 살핀다","stat":"WIS","axis":"mercy","success":"크림이가 위협 없는 길을 찾아 잃어버린 이름 몇 개를 되돌린다.","failure":"나무가 문을 닫지만 크림이의 은방울이 새로운 신호를 남긴다."},{"label":"은방울의 음정을 기록해 세계의 기억을 복원한다","stat":"INT","axis":"lore","success":"나무가 과거 회차의 한 장면을 공개한다.","failure":"기록은 덜 완성됐지만 방울이 달라진 이유를 알아낸다."}],"fallout":"크림이가 기억을 되찾는 과정에서 다른 기억을 잃을 수도 있다는 경고가 나온다."},{"title":"세린이 먼저 떠나는 밤","pivot":"세린은 동생을 데려오기 위해 캠프를 떠난다. 동료가 함께하길 거부하는 것이 배신일까, 자율적인 선택일까.","choices":[{"label":"세린에게 자신의 결정을 설명할 기회를 준다","stat":"CHA","axis":"mercy","success":"세린은 계획을 밝히고 지원을 요청할 조건을 정한다.","failure":"세린은 자신의 경로를 숨긴 채 떠나지만 돌아올 단서를 남긴다."},{"label":"동생의 경로를 추적해 세린에게 가능한 해법을 보여준다","stat":"INT","axis":"lore","success":"세린의 동생은 탈출보다 기억 봉인을 먼저 풀려 한다는 사실이 드러난다.","failure":  return head+'<p>현재 화면을 확인할 수 없습니다.</p>';
}
function renderCharacter(){const s=state,p=s.player,role=ROLES[p.role],blood=ANCESTRIES[p.ancestry];let pending=p.pendingGrowth[0];return `<div class="eyebrow">CHARACTER & BUILD</div><h2 class="storyTitle">${esc(p.name)} · ${esc(role.name)}</h2><div class="chips"><span class="chip">Lv.${p.level} · ${p.tier}</span><span class="chip">${blood.name}</span><span class="chip">${BACKGROUNDS[p.background].name}</span><span class="chip">${role.tag}</span></div><p class="story">${esc(role.desc)}<br>혈통 특성: <b>${esc(blood.trait)}</b> — ${esc(blood.desc)}</p><h3 class="panelTitle">능력치</h3><div class="statGrid">${ATTRS.map(k=>`<div class="statCard"><span>${k} · ${ATTR_NAMES[k]}</span><b>${p.stats[k]}</b><span>보정 ${m(p.stats[k])>=0?'+':''}${m(p.stats[k])}</span></div>`).join('')}</div><h3 class="panelTitle">현재 기술 · 배운 기능</h3><div class="roleList">${p.skills.map(x=>`<div class="skillCard"><strong>${esc(x.name)}</strong><small>${esc(x.slot)}${x.id?.startsWith('skill')&&!p.unlocked.includes(x.id)?' · 미해금':''}</small></div>`).join('')}${role.skills[2]&&p.unlocked.includes('skill3')?`<div class="skillCard"><strong>${role.skills[2][0]}</strong><small>세 번째 액티브 · 고급 기술</small></div>`:''}</div><h3 class="panelTitle">성장 보상</h3>${pending?`<p class="notice">Lv.${pending} 보상: ${GROWTH_REWARDS[pending]}. 선택한 효과는 즉시 능력치와 전투에 반영됩니다.</p>${growthOptions(s).map(o=>option(o.name,'grow_'+o.id,o.desc)).join('')}`:'<p class="empty">미수령 성장 보상이 없습니다. 주요 사건과 서브퀘스트에서 XP를 획득하세요.</p>'}${p.pendingGrowth.length>1?`<p class="mini">추가 대기 보상 ${p.pendingGrowth.length-1}개</p>`:''}<h3 class="panelTitle">성장 이력</h3>${p.growthHistory.length?p.growthHistory.map(g=>`<div class="journalLine">Lv.${g.level} · ${esc(g.label)}</div>`).join(''):'<p class="empty">레벨업 후 성장 경로를 직접 선택할 수 있습니다.</p>'}<p class="mini">v10 레벨 상한 Lv.12 · XP 추가 배율 없음 · 능력치 보정은 실제 주사위에 반영됩니다.</p>`;}
function renderJournal(){let s=state;return `<div class="eyebrow">THE WORLD REMEMBERS</div><h2 class="storyTitle">연대기 기록</h2><div class="chips"><span class="chip">완료 ${s.seen.length}/20장</span><span class="chip">전체 선택 ${s.metrics.choices}</span><span class="chip">서브퀘스트 ${s.sideDone.length}/18</span><span class="chip">회차 ${s.cycle}</span><span class="chip">추정 실제 플레이 ${Math.floor((s.metrics.realPlaySeconds||0)/60)}분</span></div><h3 class="panelTitle">고정된 세계 사실 · ${s.flags.length}개</h3><div class="journalLine">${s.flags.length?esc(s.flags.filter(x=>x.startsWith('route_')||x.startsWith('chapter_completed_')||x.startsWith('side_success_')).slice(-25).join(' · ')):'아직 확정된 사건 없음'}</div><h3 class="panelTitle">NPC 및 세력</h3>${line('크림이',`신뢰 ${s.cream.trust}`)}${line('세린',`${s.serin.joined?'합류':'별도 목표'} · 신뢰 ${s.serin.trust}`)}${line('수호단',s.world.wardens)}${line('기록원',s.world.archive)}${line('독립 연합',s.world.covenant)}${line('황혼단',s.world.cult)}<h3 class="panelTitle">과거 엔딩</h3>${s.endings.length?s.endings.map(e=>`<div class="journalLine">${e.cycle}회차 · ${esc(e.name)}</div>`).join(''):'<p class="empty">아직 엔딩이 없습니다.</p>'}<h3 class="panelTitle">최근 사건 기록</h3>${s.log.slice(-110).reverse().map(l=>`<div class="journalLine"><small class="mini">#${l.id} · ${esc(l.kind)} · DAY ${Math.floor(l.at/1440)+1}</small><div>${esc(l.message)}</div></div>`).join('')}`}
function renderArchive(){return `<div class="eyebrow">SAVE & RECOVERY</div><h2 class="storyTitle">캠페인 보관함</h2><p class="story">v14.1은 새 저장소를 사용합니다. 이전 v14 세이브를 수동으로 불러올 수 있습니다. 이전 v13 기록은 읽거나 덮어쓰지 않습니다. 게임은 같은 브라우저와 주소에서 자동 저장되지만 기기를 바꾸거나 브라우저 데이터를 지우면 기록이 사라질 수 있습니다.</p><div class="saveBox">${line('UI 오류 기록',state.metrics.buttonErrors??0)}${line('세이브 버전',state.version)}${line('현재 장',`${state.chapter+1}장`)}${line('유효한 상태',validSave(state)?'예':'아니오')}${line('완료 로그',state.log.length)}<div class="rowBtns"><button class="primary" data-command="export">JSON 세이브 다운로드</button><button class="secondary" data-command="import">JSON 불러오기</button></div><div class="rowBtns"><button class="secondary" data-command="recoverBackup">직전 로컬 세이브 복구</button><button class="secondary" data-command="downloadLog">플레이 로그 내려받기</button></div></div><p class="notice">GitHub Public 저장소에 개인 세이브 JSON이나 API 키를 업로드하지 마세요. Google Drive에 개인 백업을 보관할 수 있습니다.</p><hr class="divider"><button class="secondary" data-command="reset">v14.1 새 캠페인 시작</button>`;}
function render(){hud();document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x.dataset.tab===tab));$('game').innerHTML=!state?renderSetup():tab==='adventure'?renderAdventure():tab==='character'?renderCharacter():tab==='journal'?renderJournal():renderArchive();}
function perform(cmd){if(busy)return;busy=true;try{capturePlaytime();let r=act(state,cmd);if(!r.ok){state.metrics.buttonErrors++;(state.metrics.uiErrors??=[]).push({at:Date.now(),chapter:state.chapter+1,phase:state.phase,action:cmd.id,reason:r.error});state.metrics.uiErrors=state.metrics.uiErrors.slice(-50);save();notify(r.error);return;}state=r.state;save();render();}finally{busy=false;}}
function syncDraft(){let k=$('nameInput');if(k)draft.name=k.value;}
function start(){syncDraft();draft.ancestry=$('ancestryInput').value;draft.background=$('backgroundInput').value;draft.difficulty=$('difficultyInput').value;try{state=newGame(draft);lastPlayInteraction=performance.now();tab='adventure';save();render();}catch(e){notify(e.message);}}
function ng(){try{let difficulty=$('ngDifficulty').value,boon=$('ngBoon').value;state=startNextCycle(state,{difficulty,boon});lastPlayInteraction=performance.now();tab='adventure';save();render();}catch(e){notify(e.message);}}
function restore(raw){try{let next=parseSave(raw);state=next;tab='adventure';save();render();notify('v14 호환 세이브를 불러왔습니다.');}catch(e){notify('가져오기 실패: '+e.message);}}
function init(){load();render();document.body.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){capturePlaytime();tab=b.dataset.tab;render();save();return;}
 if(b.dataset.role){syncDraft();draft.role=b.dataset.role;draft.stats=presetStats(draft.role);render();return;}
 if(b.dataset.stat){syncDraft();let k=b.dataset.stat,delta=Number(b.dataset.delta),n=draft.stats[k]+delta;if(n<8||n>15)return;const was=POINT_COST[draft.stats[k]],cost=POINT_COST[n],remaining=27-pointsUsed(draft.stats);if(delta>0&&remaining<cost-was){notify('남은 포인트가 부족합니다.');return;}draft.stats[k]=n;render();return;}
 if(b.dataset.command){let c=b.dataset.command;if(c==='start'){start();return;}if(c==='preset'){syncDraft();draft.stats=presetStats(draft.role);render();return;}if(c==='ng'){ng();return;}if(c==='export'){download(`AEGIS_v14_1_${state.cycle}회차_${state.chapter+1}장.json`,serialise(state));return;}if(c==='downloadLog'){download('AEGIS_v14_1_play_log.json',JSON.stringify({session:state.id,version:state.version,metrics:state.metrics,log:state.log},null,2));return;}if(c==='import'){$('importFile').click();return;}if(c==='recoverBackup'){try{let raw=localStorage.getItem(BACKUP_KEY);if(!raw)throw Error('백업이 없습니다.');restore(raw);}catch(e){notify(e.message)}return;}if(c==='reset'){if(confirm('현재 v14.1 모험을 초기화할까요? JSON 백업을 먼저 받으세요.')){state=null;tab='adventure';localStorage.removeItem(SAVE_KEY);render();}return;}}
 if(b.dataset.act){let cmd={id:b.dataset.act};if(state?.phase==='combat'){cmd.move=$('battleMove')?.value??'hold';cmd.bonus=$('battleBonus')?.value??'hold';}perform(cmd);}
 });document.body.addEventListener('change',e=>{if(!state){if(e.target.id==='ancestryInput'){syncDraft();draft.ancestry=e.target.value;render();}if(e.target.id==='backgroundInput'){syncDraft();draft.background=e.target.value;render();}if(e.target.id==='difficultyInput'){syncDraft();draft.difficulty=e.target.value;render();}}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){capturePlaytime();save();}else lastPlayInteraction=performance.now();});$('importFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(f)restore(await f.text());e.target.value='';});}
init();
</script></body></html>
