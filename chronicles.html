*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -12%,#273648 0%,transparent 60%),var(--bg);color:var(--ink);min-height:100vh}button,select,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a8bfef;outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:1170px;margin:auto;padding:0 18px 64px}header{padding:25px 0 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;font:500 clamp(22px,3.3vw,32px)/1.25 Georgia,'Times New Roman',serif;color:var(--gold);letter-spacing:.04em}.eyebrow{font:700 10px/1.4 sans-serif;letter-spacing:.21em;color:#b9a17d}.sub{font-size:12px;color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;align-items:start;gap:17px;padding-top:18px}.card{background:linear-gradient(155deg,#1e2530,#171d25);border:1px solid var(--border);border-radius:15px;overflow:hidden}.maincard{min-width:0}.padded{padding:23px 25px}.muted{color:var(--muted)}.tiny{font-size:12px}.tag{display:inline-block;border:1px solid #635747;background:#2b2a29;padding:2px 9px;border-radius:20px;color:var(--gold);font-size:11px;font-weight:600}.progress{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 21px}.progress i{display:block;height:6px;flex:1;min-width:8px;background:#35404c;border-radius:4px}.progress i.done{background:#b7a078}.progress i.current{background:#d7c7a9;box-shadow:0 0 8px #b39c7347}.sectionHeading{display:flex;justify-content:space-between;gap:10px;align-items:center}.sectionHeading h2{margin:7px 0 5px;font:500 28px/1.3 Georgia,'Malgun Gothic',serif}.description{white-space:pre-line;color:#dfded8;line-height:1.9;margin:18px 0}.question{padding-top:16px;border-top:1px solid var(--border);color:#e9dfc9;font-size:16px;font-weight:650}.choices{display:grid;gap:11px;margin:16px 0}.choice{width:100%;background:#252e3a;border:1px solid #47505c;border-radius:12px;padding:14px 16px;text-align:left;color:var(--ink);transition:background .15s,border-color .15s;min-height:66px}.choice:hover{background:#303d4b;border-color:#ac966b}.choice:active{background:#384556;transform:translateY(1px)}.choice small{display:block;color:#adb6bc;font-size:11px;margin-top:3px}.choice .mark{color:var(--gold);margin-right:7px}.actionLine{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#2a3542;border:1px solid #546171;border-radius:9px;padding:11px 14px;color:var(--ink);font-weight:650;min-height:43px}.btn.gold{background:#a78856;border-color:#ccac78;color:#14171b}.btn.red{border-color:#785452;background:#422d30}.btn.light{border-color:#546a60;background:#274136}.btn:active{filter:brightness(1.2)}.side{padding:20px}.side h3{font:600 12px/1.4 sans-serif;letter-spacing:.14em;color:var(--gold);margin:0 0 12px}.stat{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:7px 0;color:var(--muted)}.stat b{color:var(--ink);font-weight:650}.meter{height:6px;background:#353b43;border-radius:6px;overflow:hidden;margin:-1px 0 9px}.meter span{display:block;height:100%;border-radius:6px;background:#9bb4a4}.meter.mp span{background:#9db5d7}.meter.sp span{background:#cfb08d}.divider{border:0;border-top:1px solid var(--border);margin:17px 0}.tabs{display:flex;gap:4px;padding:0 14px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}.tab{background:transparent;border:0;color:var(--muted);font-weight:650;padding:10px 12px;border-radius:8px;font-size:13px}.tab.active{background:#35404b;color:#f2e1c3}.result{border:1px solid #647867;background:linear-gradient(150deg,#28382f,#1f282b);border-radius:12px;padding:18px;margin-top:18px}.result.fail{border-color:#805c56;background:linear-gradient(150deg,#392d2e,#27262a)}.result h3{margin:0;color:#e9d8b2}.result p{margin:10px 0}.record{font:12px/1.7 ui-monospace,monospace;color:#c0c3c9;border-top:1px dashed #555b61;padding:9px 0;overflow-wrap:anywhere}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formField{display:grid;gap:5px;font-size:12px;color:#d0c6b6}.formField input,.formField select{background:#202732;border:1px solid #505b69;border-radius:8px;color:white;padding:11px;min-width:0;width:100%}.formField option{background:#202732;color:#eee}.attribute-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.attribute{border:1px solid var(--border);padding:10px;background:#202731;border-radius:9px;text-align:center}.attribute b{display:block;font-size:13px}.attribute .score{display:flex;justify-content:center;align-items:center;gap:10px}.attribute button{border:1px solid #606872;border-radius:5px;background:#303b48;color:#fff;width:27px;height:28px;padding:0}.attribute span{font-weight:700}.battleBox{background:#26202a;border:1px solid #5d4a56;border-radius:12px;padding:16px;margin:15px 0}.battleBox h3{margin:0}.battlegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.battlebar{height:9px;border-radius:10px;background:#493639;overflow:hidden}.battlebar>span{display:block;height:100%;background:#c57f77}.battleButtons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.battleButtons button{min-height:60px}.radioLine{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 13px}.radioLine label{background:#232d37;border:1px solid #425062;border-radius:8px;padding:7px 9px;font-size:12px}.radioLine input{margin-right:3px}.field{padding:12px;border:1px solid var(--border);border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:14px}.field .help{font-size:12px;color:var(--muted)}.full{width:100%}.notice{border-left:3px solid var(--gold);padding:9px 14px;background:#272b30;color:#d7d5ce;font-size:12px}.logrow{padding:8px 0;border-bottom:1px solid #313945;font-size:12px;line-height:1.55}.logrow b{color:#dbc194;font-size:10px;display:block}.foot{padding:23px 0;text-align:center;color:#79838d;font-size:11px}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#4c3439;border:1px solid #986d71;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 8px 28px #0008;z-index:10;max-width:92vw;display:none}#toast.visible{display:block}.endingTitle{color:var(--gold);font:500 33px/1.35 Georgia,serif}.endCard{background:radial-gradient(ellipse at 70% 30%,#423b30,#21262d);border:1px solid #806c50;padding:24px;border-radius:13px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

</style><script>/* Original fantasy campaign. Twenty finite chapters, two decision beats each. */
const D=(title,region,intro,first,second,battle=null)=>({title,region,intro,beats:[first,second],battle});
const B=(text,options)=>({text,options});
const O=(label,stat,dc,success,failure,axis,points=1)=>({label,stat,dc,success,failure,axis,points});
const STORY=[
D('꺼진 종의 항구','회색 항구','항구의 새벽에는 늘 종이 울렸다. 오늘은 파도 소리만 돌벽을 때린다. 작은 비숑 크림이가 은방울을 흔들며 부두 아래를 바라본다. 부두 일꾼들은 무언가를 봤지만 아무도 먼저 말하려 하지 않는다.',
 B('부두의 소동을 어떻게 조사할까?',[
 O('일꾼에게 차분히 사정을 듣는다','CHA',11,'선장이 마지막 종소리를 들은 시각과 붉은 돛을 기억해 낸다.','일꾼은 입을 다물지만, 그의 시선은 닻 창고를 향한다.','mercy'),
 O('크림이가 맡은 냄새를 따라간다','WIS',11,'바닷물 속에 섞인 낯선 유황의 흔적을 찾는다.','희미한 냄새만 남는다. 크림이가 위험을 알리는 듯 몸을 낮춘다.','lore'),
 O('창고의 자물쇠를 조사한다','INT',12,'낡은 자물쇠는 안쪽에서 열린 흔적이 있다. 납치가 아니라 공모였다.','흠집만 보이지만 관리인이 과하게 놀라는 반응을 보인다.','order')]),
 B('항구 경비가 증인을 끌고 가려 한다. 무슨 선택을 할까?',[
 O('증인을 보호하고 공개 진술을 요구한다','CHA',12,'경비는 한발 물러나고 시민들이 증인의 이름을 기억한다.','증인은 연행되지만 목격자들이 사건을 퍼뜨리기 시작한다.','mercy'),
 O('경비의 이동 경로를 몰래 확인한다','DEX',12,'병사들이 향하는 창고와 남몰래 쓰는 암호를 알아낸다.','경비가 낌새를 채지만 숨은 문양을 본 것은 확실하다.','lore'),
 O('경비의 허점을 직접 지적한다','STR',12,'경비는 무력을 쓰지 못하고 물러선다.','충돌 직전까지 갔지만 크림이가 끼어들어 상황이 가라앉는다.','order')])),
D('안개숲의 이방인','안개숲','북쪽 숲은 가도가 끝나는 곳에서 시작된다. 사라진 종을 실은 마차의 자국은 이쪽으로 향했다. 큰 나무 아래 한 여인이 마차 잔해를 치우며 구조 신호를 보낸다.',
 B('여인은 자신을 세린이라 소개하며 동생을 찾는다고 말한다.',[
 O('구조를 돕고 함께 진실을 찾자고 제안한다','WIS',12,'세린은 손을 내민다. 위험한 길에서 서로 등을 맡길 가능성이 생겼다.','세린은 고맙다고 말하지만 아직 당신을 경계한다.','mercy'),
 O('마차와 추격 흔적부터 확인한다','INT',12,'습격자는 물건이 아니라 사람 하나만 노렸다. 세린의 이야기와 일치한다.','정보는 불완전하다. 세린은 당신의 신중함을 지켜본다.','lore'),
 O('추격대가 오기 전에 급히 옮긴다','DEX',12,'적을 피할 고지대를 발견해 세린을 안전하게 이끈다.','적이 가까워졌으나 세린이 지형을 활용해 몸을 숨긴다.','order')]),
 B('추격자들이 숲길을 가로막는다. 전투를 피할 길도 있다.',[
 O('추격자의 지휘관에게 이유를 묻는다','CHA',13,'그들이 정식 군이 아니라 사설 추적대임을 밝힌다.','그는 대답하지 않지만 갑옷에 왕도 문양이 없다는 점을 알아차린다.','mercy'),
 O('연막을 만들어 크림이와 우회한다','DEX',13,'숲의 경사면을 통해 적의 뒤를 잡는 길이 열린다.','연막은 금세 걷히지만 빠져나갈 틈은 만들어졌다.','lore'),
 O('전열을 정비하고 정면으로 나선다','STR',12,'세린이 활을 들고 당신의 후방을 맡는다.','적의 방패는 예상보다 단단하다. 크림이가 경계한다.','order')]),'scout'),
D('길드의 두 장부','갈림길 길드','길드는 북쪽 도로를 봉쇄한 뒤 용병에게만 통행권을 팔고 있었다. 게시판에는 사라진 주민들의 이름 대신 수배된 도적의 초상만 붙어 있다.',
 B('길드 책임자는 기록 열람을 거부한다.',[
 O('두 장부의 금액 차이를 논리로 추궁한다','INT',13,'장부 한 권이 조작됐다는 증거를 확보한다.','수치는 맞지 않지만 증인에게 당장 확인받지 못한다.','lore'),
 O('실종자 가족의 진술을 먼저 듣는다','WIS',12,'서로 다른 증언에서 같은 붉은 인장 이야기가 나온다.','가족들은 두려워하지만 크림이에게 경계를 조금 푼다.','mercy'),
 O('통행세를 내고 먼저 현장을 확보한다','CHA',12,'정식 통행증을 받아 한시적인 행동권을 얻는다.','통행증 발급은 지연되지만 내부 경비 교대 시각을 알아낸다.','order')]),
 B('길드 직원 하나가 밀서를 건넨다. 그를 어떻게 대할까?',[
 O('익명을 보장하고 증언을 기록한다','CHA',13,'밀서에는 종을 옮긴 인물의 이름이 적혀 있다.','밀서는 찢겼지만 인장 일부를 지켜낸다.','mercy'),
 O('밀서의 잉크와 종이를 확인한다','INT',12,'이 문서가 왕도에서 온 지령임을 확인한다.','출처는 불명확하지만 지령의 날짜가 어긋나는 것을 발견한다.','lore'),
 O('직원의 안전한 탈출을 마련한다','DEX',13,'그는 나중에 다시 도움을 주겠다고 약속한다.','탈출은 간신히 성공한다. 길드는 누가 정보를 흘렸는지 찾기 시작한다.','order')])),
D('붉은 협곡의 협상','붉은 협곡','협곡에는 임시 징수소가 생겨난 지 오래다. 황혼단의 병사와 굶주린 난민이 한 줄에서 대치하고 있다. 누구의 편에 서도 오래된 질서가 흔들린다.',
 B('난민은 길을 열어 달라고 요구한다.',[
 O('식량을 나누고 통과 협상을 한다','CHA',13,'아이를 업은 가족부터 지나간다. 전쟁보다 생명이 먼저라는 소문이 남는다.','모두를 지나가게 하진 못하지만 하루분 식량을 확보한다.','mercy'),
 O('징수소 문서에서 허위 명령을 찾는다','INT',14,'명령서는 이미 폐기된 왕도 직인을 사용하고 있었다.','직인 진위를 결론내지 못하지만 책임자가 서류를 숨긴다.','lore'),
 O('바위길을 찾아 우회 통로를 연다','DEX',13,'작은 무리가 경비 눈을 피해 협곡을 넘는다.','길이 위험해 돌아가지만 감시탑의 맹점을 발견한다.','order')]),
 B('징수소 지휘관이 더는 협상을 허락하지 않는다.',[
 O('무력 충돌 전에 마지막으로 항복을 권한다','CHA',14,'병사 일부가 무기를 낮춘다.','지휘관은 거절하지만 병사들은 흔들린다.','mercy'),
 O('수레와 바위로 적의 시야를 가린다','INT',13,'적의 장창이 제대로 힘을 쓰지 못하는 지형이 된다.','차단은 완벽하지 않지만 난민이 물러날 시간을 번다.','lore'),
 O('선두에 서서 돌파한다','STR',13,'협곡에 울리는 발걸음이 난민의 두려움을 덜어낸다.','충돌을 피하지 못한다. 동료는 당신의 선택을 기억한다.','order')]),'guard'),
D('망각된 왕도의 편지','오래된 왕도','왕도에서 온 편지는 비가 젖은 채 발견된다. 봉인 없는 문서는 왕가의 서명이 아니라 폐위된 섭정의 글씨를 담고 있다.',
 B('문서의 수신인은 누구일까?',[
 O('편지를 시민 대표에게 공개한다','CHA',14,'시민들이 왕가의 내부 분열을 알게 된다.','폭로가 일찍 퍼져 군중이 동요하지만 침묵은 깨졌다.','mercy'),
 O('서명과 왕실 문서의 날짜를 대조한다','INT',13,'섭정이 종을 옮기기 전 이미 계획을 세웠다는 사실이 드러난다.','추정만 가능하지만 서명이 최근 쓰인 것이라는 단서를 얻는다.','lore'),

function renderBattle(s){const b=s.battle,p=s.player,c=CLASSES[p.role];return `<div class="eyebrow">TACTICAL ENCOUNTER · ROUND ${b.round}</div><div class="battleBox"><h3>${e(b.enemy.name)}</h3><div class="battlegrid"><div><div class="muted tiny">적 HP ${b.enemy.hp}/${b.enemy.maxHP}</div><div class="battlebar"><span style="width:${clamp(100*b.enemy.hp/b.enemy.maxHP,0,100)}%"></span></div></div><div class="tiny muted">DEF ${b.enemy.def}<br>거리 ${['근접','중거리','원거리'][b.distance]}</div></div><div class="record">${e(b.notes.slice(-2).join(' · '))}</div></div><p class="question">이번 라운드의 작전을 선택하세요.</p><div class="tiny muted">이동과 주행동을 한 번에 처리합니다. 사거리·자원 부족은 비용 차감 전에 검증합니다.</div><div class="radioLine"><label><input type="radio" name="move" value="hold" checked>위치 유지</label><label><input type="radio" name="move" value="approach">접근 (1구역)</label><label><input type="radio" name="move" value="withdraw">이탈 (1구역)</label></div><div class="battleButtons"><button class="choice" data-combat="basic">⚔ 기본 공격<small>${c[4]?'원거리':'근접'} · MP 0</small></button><button class="choice" data-combat="skill1">✦ ${e(c[2])}<small>MP 12 · 주행동</small></button><button class="choice" data-combat="skill2">✧ ${e(c[3])}<small>MP 18 · 주행동</small></button><button class="choice" data-combat="guard">🛡 방어<small>DEF+3 · SP+5</small></button><button class="choice" data-combat="potion">🧪 물약 사용<small>HP+70 · ${p.potions}개 보유</small></button><button class="choice" data-combat="parley">💬 전투 중 교섭<small>CHA 판정 · 비살상</small></button><button class="choice" data-combat="retreat">↩ 후퇴 시도<small>DEX 판정 · 전투 종료 가능</small></button></div><p class="tiny muted">크림이${s.serin.joined?'와 세린':''}는 플레이어 행동 후 자율적으로 행동합니다. 적은 확정된 카드와 주사위로 공격합니다.</p>`;}
function renderEnding(s){const v=s.ending;return `<div class="eyebrow">10막 20장 · THE END</div><div class="endCard"><div class="eyebrow">${e(s.ng.cycle)}회차 완결</div><h2 class="endingTitle">${e(v.title)}</h2><p class="description">${e(v.text)}</p><p class="tiny muted">자비 ${s.axis.mercy} · 진실 ${s.axis.lore} · 질서 ${s.axis.order} / 결정 ${v.choices}회 / 전투 라운드 ${v.turns}회</p><p>크림이는 당신의 곁에서 은방울을 울린다. 여정은 끝났지만, 새로운 회차에는 다른 선택과 운명이 기다린다.</p></div><h3>NEW GAME+ · 다음 회차</h3><p class="muted tiny">레벨과 장비는 초기화하고, 엔딩 기록·회차 수·선택한 특전은 계승합니다.</p><div class="twocol">${selectField('다음 회차 난이도','ngDifficulty',Object.fromEntries(Object.entries(DIFFICULTIES).map(([k,v])=>[k,[v.label]])),s.difficulty)}${selectField('계승 특전','ngBoon',BOONS,'insight')}</div><div class="actionLine">${miniButton('다음 회차 시작 →','ngplus','gold')}</div><hr class="divider"><p class="tiny muted">엔딩은 저장 파일에 남습니다. 새 게임 시작 전 JSON 백업을 권장합니다.</p>`;}
function renderCharacter(){const p=state.player,c=CLASSES[p.role];return `<div class="eyebrow">CHARACTER RECORD</div><h2>${e(p.name)}</h2><p class="muted">Lv.${p.level} ${e(c[0])} · ${e(ANCESTRIES[p.ancestry][0])} · ${e(BACKGROUNDS[p.background][0])} · ${e(p.tier)}</p><div class="attribute-grid">${STATS.map(k=>`<div class="attribute"><b>${k} · ${ATTR_KR[k]}</b><span>${p.stats[k]} (${mod(p.stats[k])>=0?'+':''}${mod(p.stats[k])})</span></div>`).join('')}</div><h3>시작 기술 10개</h3><div class="twocol">${p.skills.map(x=>`<div class="field"><span>${e(x.name)}</span><small class="muted">${e(x.slot)}</small></div>`).join('')}</div><h3>성장 기록</h3>${p.growth.length?p.growth.map(x=>`<div class="logrow">Lv.${x.level} · ${e(x.reward)}</div>`).join(''):'<p class="muted">레벨을 올리면 보상이 기록됩니다.</p>'}<p class="notice">Lv.12가 최고 레벨입니다. 경험치는 v10 기준표를 사용하며 추가 배율은 없습니다.</p>`;}
function renderJournal(){const s=state;return `<div class="eyebrow">CHRONICLE LEDGER</div><h2>세상이 기억하는 선택</h2><p class="muted">진행 ${s.seenChapters.length}/20장 · 판정 ${s.rolls.length}회(최근 기록) · 누적 회차 ${s.ng.cycle}</p><h3>동료와 세력</h3><div class="stat"><span>크림이</span><b>신뢰 ${s.cream.trust}</b></div><div class="stat"><span>세린</span><b>${s.serin.joined?'합류':'독자 활동'} · 신뢰 ${s.serin.trust}</b></div><div class="stat"><span>길드 / 황혼단 / 시민</span><b>${s.factions.guild} / ${s.factions.cult} / ${s.factions.citizens}</b></div><h3>완결한 엔딩</h3>${s.ng.endings.length?s.ng.endings.map(x=>`<div class="logrow">${x.cycle}회차 · ${e(x.title)}</div>`).join(''):'<p class="muted">첫 엔딩을 기다리고 있습니다.</p>'}<h3>사건 기록</h3>${s.log.slice().reverse().map(x=>`<div class="logrow"><b>${e(x.kind)} · ${e('DAY '+(Math.floor(x.at/1440)+1))}</b>${e(x.msg)}</div>`).join('')}`;}
function renderSave(){return `<div class="eyebrow">ARCHIVE & RECOVERY</div><h2>캠페인 저장소</h2><p class="description">동일 브라우저·동일 주소에서는 자동 저장됩니다. 아이폰 브라우저 데이터 삭제나 기기 변경에 대비하여 세이브 파일을 내려받아 Google Drive 등에 백업해 두세요.</p><div class="actionLine">${miniButton('⬇ JSON 세이브 내려받기','export','gold')}${miniButton('⬆ JSON 세이브 불러오기','import')}${miniButton('↶ 이전 자동 저장 복원','backup')}${miniButton('새 모험 시작 화면','resetSetup','red')}</div><input type="file" id="importFile" accept="application/json,.json" class="sr-only"><p class="notice">기존 v12.1 세이브는 별도 키에 남아 있으며 v13에서 자동 변환하지 않습니다. 이 게임은 인터넷 접속이나 별도의 AI API 키가 필요 없습니다.</p><p class="tiny muted">저장 스키마: ${e(state.schema)} · 현재 상태: ${e(state.phase)} · ${chapterStatus(state)}</p>`;}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`AEGIS_v13_${state.ng.cycle}회차_${state.chapter+1}장.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function create(){draft.name=el('heroName').value;draft.ancestry=el('heroAncestry').value;draft.background=el('heroBackground').value;draft.role=el('heroRole').value;draft.difficulty=el('heroDifficulty').value;try{state=startGame(draft);tab='adventure';after(true);}catch(error){toast(error.message);}}
function onCommand(cmd){if(!state&&cmd!=='create')return;try{switch(cmd){case 'create':create();return;case 'continue':outcome(next(state));return;case 'nextChapter':outcome(nextChapter(state));return;case 'shortRest':outcome(rest(state,'short'));return;case 'longRest':outcome(rest(state,'long'));return;case 'buyPotion':if(!['camp','retry'].includes(state.phase)){toast('야영지에서만 구매할 수 있습니다.');return;}if(state.player.gold<35){toast('화폐가 부족합니다.');return;}state.player.gold-=35;state.player.potions++;event(state,'회복 물약 구매 · 35G','거래');after(true);return;case 'rescue':outcome(recovery(state));return;case 'retryBattle':outcome(retryBattle(state));return;case 'export':exportSave();return;case 'import':el('importFile').click();return;case 'backup':{const old=loadBackup();if(old){state=old;after(true);toast('이전 자동 저장이 복구됐습니다.');}else toast('복구 가능한 이전 자동 저장이 없습니다.');return;}
 case 'ngplus':outcome(ngPlus(state,el('ngDifficulty').value,el('ngBoon').value));return;
 case 'resetSetup':if(!confirm('새 모험을 시작하면 v13 현재 세이브를 변경할 수 있습니다. JSON 백업을 권장합니다. 시작 화면으로 돌아갈까요?'))return;state=null;tab='adventure';render();return;default:toast('지원하지 않는 명령입니다.');return;}}catch(error){toast(error.message||'알 수 없는 오류');}}
document.body.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;try{if(b.dataset.tab){tab=b.dataset.tab;render();return;}
 if(b.dataset.stat){const k=b.dataset.stat,dir=+b.dataset.dir;let val=draft.stats[k]+dir;if(val<8||val>15)return;const next={...draft.stats,[k]:val};if(!isValidStats(next)){toast('27 Point Buy 한도를 초과했습니다.');return;}draft.stats=next;render();return;}
 if(b.dataset.choice){outcome(choose(state,b.dataset.choice));return;}
 if(b.dataset.combat){const move=document.querySelector('input[name="move"]:checked')?.value||'hold';outcome(battleAction(state,b.dataset.combat,move));return;}
 if(b.dataset.cmd){onCommand(b.dataset.cmd);return;}
 }catch(error){toast(`게임 오류: ${error.message}`);}});
document.body.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='heroRole'){draft.role=t.value;draft.stats=Object.fromEntries(STATS.map((k,i)=>[k,PRESETS[draft.role][i]]));render();}
 if(t.id==='heroAncestry'){draft.ancestry=t.value;}
 if(t.id==='heroBackground'){draft.background=t.value;}
 if(t.id==='heroDifficulty'){draft.difficulty=t.value;}
 if(t.id==='importFile'&&t.files[0]){const file=t.files[0];if(file.size>2500000){toast('세이브 파일이 너무 큽니다.');return;}file.text().then(text=>{const candidate=importState(text);if(confirm(`불러올 세이브: ${candidate.ng.cycle}회차 제${candidate.chapter+1}장. 현재 상태를 교체할까요?`)){state=candidate;tab='adventure';after(true);toast('세이브 불러오기 완료');}}).catch(err=>toast('불러오기 오류: '+err.message));}
});
render();
</script></body></html>
